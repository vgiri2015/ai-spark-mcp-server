[project]
name = "spark-mcp-server"
version = "0.1.0"
description = "MCP server for Spark code optimization"
dependencies = [
    "mcp",
    "pyspark",
    "anthropic",
    "pydantic"
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["v1/spark_mcp"]
